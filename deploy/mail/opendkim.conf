# fly.board mail stack — OpenDKIM configuration for oborona.zip
# Install: /etc/opendkim.conf, then add the DNS TXT record printed by
# install.sh (selector s1._domainkey.oborona.zip).

Domain oborona.zip
Selector s1
Canonicalization relaxed/simple
Mode sv
SubDomains no

# Key generated by install.sh under /etc/opendkim/keys/oborona.zip/
KeyFile /etc/opendkim/keys/oborona.zip/s1.private

# Postfix talks to the milter over TCP on localhost.
Socket inet:8891@localhost
PidFile /run/opendkim/opendkim.pid
UserID opendkim:opendkim

# Statistics / logging.
Syslog yes
SyslogSuccess yes
LogWhy yes
