# fly.board mail stack — Dovecot configuration for oborona.zip
# Install: /etc/dovecot/dovecot.conf (or conf.d/99-fly.conf), see install.sh.
#
# Dovecot here is a pure IMAP server: inbound delivery is done by Postfix
# piping messages through mail-import (which writes both the webmail DB and
# the Maildir), so no LMTP/LDA is needed.

protocols = imap

# Mail storage written by mail-import (Postfix pipe transport).
mail_location = maildir:/var/mail/fly/%u

# --- Authentication: checkpassword against the fly.board user database -----
passdb {
    driver = checkpassword
    args = /home/yjlee/fly.board/mail-verify
}
userdb {
    driver = checkpassword
    args = /home/yjlee/fly.board/mail-verify userdb
}

# mail-verify enforces users.email_verified=1, so unverified signups can
# never open an IMAP session even if they know their password.

# --- TLS: reuse the site's certificate (or point at a certbot live dir) ----
ssl = yes
ssl_cert = </home/yjlee/fly.board/cert-backup-rsa4096/server.crt
ssl_key  = </home/yjlee/fly.board/cert-backup-rsa4096/server.key
# For a Let's Encrypt cert instead:
#ssl_cert = </etc/letsencrypt/live/oborona.zip/fullchain.pem
#ssl_key  = </etc/letsencrypt/live/oborona.zip/privkey.pem
ssl_min_protocol = TLSv1.2

# --- Listeners --------------------------------------------------------------
service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

# mail-import creates maildirs on demand; make sure Dovecot can read them.
mail_access_groups =
default_login_user = dovenull
first_valid_uid = 1000

auth_mechanisms = plain login
disable_plaintext_auth = yes
