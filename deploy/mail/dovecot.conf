# fly.board mail stack — Dovecot configuration for oborona.zip
# Install: /etc/dovecot/dovecot.conf, see install.sh.
#
# Dovecot 2.4 syntax (Debian trixie ships 2.4.x). NOTE: the checkpassword
# driver was removed in Dovecot 2.4, so authentication goes through PAM:
#   passdb pam -> /etc/pam.d/fly-mail -> pam_exec.so -> mail-verify pam
# which verifies against the fly.board user database (and rejects
# users.email_verified=0, so unverified signups can never open IMAP).
#
# Dovecot here is a pure IMAP server: inbound delivery is done by Postfix
# piping messages through mail-import (which writes both the webmail DB and
# the Maildir), so no LMTP/LDA is needed.

dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4

protocols = imap

# Mail storage written by mail-import (Postfix pipe transport).
mail_driver = maildir
mail_path = /var/mail/fly/%{user}

# --- Authentication ---------------------------------------------------------
auth_mechanisms = plain login
auth_allow_cleartext = no

passdb pam {
    pam_service_name = fly-mail
}

userdb static {
    fields {
        home = /var/mail/fly/%{user}
        uid = flymail
        gid = flymail
    }
}

# --- TLS: dedicated self-signed cert for mail.oborona.zip -------------------
# A cert with SAN mail.oborona.zip is generated by install.sh. For a Let's
# Encrypt cert instead, point these at the live dir:
#ssl_server_cert_file = </etc/letsencrypt/live/oborona.zip/fullchain.pem
#ssl_server_key_file  = </etc/letsencrypt/live/oborona.zip/privkey.pem
ssl = yes
ssl_server_cert_file = /etc/dovecot/mail.crt
ssl_server_key_file  = /etc/dovecot/mail.key
ssl_min_protocol = TLSv1.2

# --- Listeners --------------------------------------------------------------
service imap-login {
    inet_listener imap {
        port = 143
    }
    inet_listener imaps {
        port = 993
        ssl = yes
    }
}

# mail-import hands each mailbox to the flymail user after delivery.
first_valid_uid = 0
default_login_user = dovenull
